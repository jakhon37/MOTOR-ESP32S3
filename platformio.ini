; MOTOR-ESP32S3/platformio.ini

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
; Arduino core 2.0.x. Unpinned, this now resolves to core 3.x, which removes ledcSetup.
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = 
    adafruit/Adafruit NeoPixel@^1.12.0
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
monitor_speed = 115200
upload_speed = 115200
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I include

; Control and protocol tests that run on the PC, with no board: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = 
    -std=gnu++17
    -I include
lib_ignore = MotorControl, MicroROSNode
